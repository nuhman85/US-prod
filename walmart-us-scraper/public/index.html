<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Walmart US HTML Importer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="hero">
      <span class="eyebrow">Walmart US</span>
      <h1>Product HTML importer</h1>
      <p>Select a saved Walmart search page, review the first 15 products, then import them into PostgreSQL.</p>
    </section>

    <section class="panel">
      <form id="upload-form">
        <label class="drop-zone" id="drop-zone">
          <input id="html-file" name="htmlFile" type="file" accept=".html,.htm,text/html" required>
          <span class="icon">↑</span>
          <strong id="file-label">Choose a Walmart HTML file</strong>
          <small>HTML or HTM, up to 20 MB</small>
        </label>
        <div class="actions">
          <button id="preview" type="submit">Preview products</button>
          <button id="import" type="button" class="primary" disabled>Import to database</button>
        </div>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section id="results" class="panel results" hidden>
      <div class="results-heading">
        <div><span class="eyebrow">Preview</span><h2>Products found</h2></div>
        <span id="count" class="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Product</th><th>SKU</th><th>Price</th><th>Specifications</th></tr></thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
